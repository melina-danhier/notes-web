spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/notes}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  flyway:
    validate-on-migrate: true

logging:
  level:
    root: INFO
    com.melina.notes: DEBUG
