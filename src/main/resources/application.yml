spring:
  application:
    name: notes-service

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  demo:
    account-lifetime: ${DEMO_ACCOUNT_LIFETIME:PT2H}
    cleanup-interval: ${DEMO_CLEANUP_INTERVAL:PT15M}
    max-accounts: ${DEMO_MAX_ACCOUNTS:50}
