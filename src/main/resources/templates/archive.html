<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/theme.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
    <title>Archiv</title>

    <link href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="/css/notes.css"/>

    <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initNotePreviewModal, viewNote, closeNoteModal, closeNoteModalAndReload } from '/js/note-preview.js';

        window.viewNote = viewNote;
        window.closeNoteModal = closeNoteModal;
        window.closeNoteModalAndReload = closeNoteModalAndReload;

        document.addEventListener('DOMContentLoaded', initNotePreviewModal);
    </script>
    <script src="/js/archive.js" type="module"></script>
</head>
<body>

<div class="con">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 mb-lg-2">
        <h2 class="fs-4 fs-lg-2 mb-0">Archiv</h2>

        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/notes}">
                &larr; <span class="mobile-label">Zur&uuml;ck zu Notizen</span>
            </a>
        </div>
    </div>

    <div class="bulk-action-bar d-none mb-3" id="bulkActionBar">
        <div class="bulk-selection-count">
            <strong id="selectedNoteCount">0</strong> ausgew&auml;hlt
        </div>
        <div class="bulk-action-buttons">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="clearSelectionBtn" title="Auswahl aufheben">✕ <span class="mobile-label">Aufheben</span></button>
            <button type="button" class="btn btn-outline-success btn-sm" data-bulk-action="restore" title="Wiederherstellen">♻️ <span class="mobile-label">Wiederherstellen</span></button>
            <button type="button" class="btn btn-danger btn-sm" data-bulk-action="delete" title="In den Papierkorb">🗑️ <span class="mobile-label">Papierkorb</span></button>
        </div>
    </div>

    <div class="center-gap m-3" id="archiveEmptyState"
         th:style="${notes.content.isEmpty()} ? '' : 'display: none;'">
        <h5 class="fst-italic">Archiv ist leer</h5>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 g-lg-2" id="archiveList" th:if="${notes != null}">
        <div class="col" th:each="note : ${notes.content}" th:id="'note-' + ${note.id}">
            <div class="card h-100 border-1 shadow-sm rounded-4 overflow-hidden click-card"
                 th:onclick="'viewNote(' + ${note.id} + '); event.stopPropagation();'"
                 th:data-note-id="${note.id}">
                <label class="note-select-toggle" title="Notiz ausw&auml;hlen" onclick="event.stopPropagation();">
                    <input type="checkbox" class="note-select-checkbox" th:value="${note.id}" aria-label="Notiz ausw&auml;hlen">
                    <span></span>
                </label>
                <div class="card-header d-flex justify-content-between align-items-center p-3">
                    <h5 class="title m-0" th:text="${note.title}">Notiz</h5>

                </div>

                <div class="card-body d-flex flex-column justify-content-between gap-2 p-3">
                    <div class="d-flex gap-2">
                        <span class="text-primary-emphasis bg-primary-subtle rounded-3 p-1"
                              th:if="${note.tags != null and #lists.size(note.tags) > 0}"
                              th:each="tag : ${note.tags}"
                              th:text="'#' + ${tag}">
                        </span>
                    </div>

                    <div class="h-100">
                        <span class="content"
                              th:text="${note.contentPreview != null and note.contentPreview.length() > 0 ? note.contentPreview : ''}">
                            Inhalt
                        </span>
                    </div>

                </div>
                <div class="card-footer d-flex align-items-center p-3">
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-success px-2 py-1"
                                title="Wiederherstellen"
                                th:onclick="'unarchiveNote(' + ${note.id} + '); event.stopPropagation();'">
                            ♻️ <span class="mobile-label"></span>
                        </button>
                        <button class="btn btn-danger px-2 py-1"
                                title="In den Papierkorb"
                                th:onclick="'deleteArchivedNote(' + ${note.id} + '); event.stopPropagation();'">
                            🗑️ <span class="mobile-label"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="center-gap justify-content-center mt-4 mobile-pagination" th:if="${totalPages > 1}">
        <a class="btn btn-outline-secondary"
           th:classappend="${currentPage == 0} ? 'disabled'"
           th:href="@{/notes/archive(pageNo=${currentPage - 1}, pageSize=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}">
            &larr; <span class="mobile-label">Zur&uuml;ck</span>
        </a>

        <a class="btn btn-outline-secondary"
           th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'"
           th:href="@{/notes/archive(pageNo=${currentPage + 1}, pageSize=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}">
            <span class="mobile-label">Weiter</span> &rarr;
        </a>
    </div>

</div>

<div id="noteViewModal" class="note-view-modal" style="display: none;">
    <div class="note-view-modal-backdrop"></div>
    <div class="note-view-modal-dialog">
        <div class="note-view-modal-content">
            <div class="note-view-modal-header">
                <h3 id="modalTitle" class="m-0"></h3>
                <button type="button" class="note-view-close-btn" onclick="closeNoteModalAndReload()" title="Schlie&szlig;en">&times;</button>
            </div>
            <div class="note-view-modal-body">
                <div id="modalTags" class="note-modal-tags mb-3"></div>
                <div id="modalContent" class="note-modal-content"></div>
            </div>
            <div class="note-view-modal-footer">
                <div id="modalTimestamp" class="note-modal-timestamp text-muted small"></div>
                <div class="note-view-modal-actions">
                    <button type="button" class="btn btn-outline-success btn-sm" id="modalUnarchiveBtn" title="Wiederherstellen">♻️</button>
                    <button type="button" class="btn btn-danger btn-sm" id="modalArchiveDeleteBtn" title="In den Papierkorb">🗑️</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
