<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
    <title>Notizen</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css"/>
    <link rel="stylesheet" href="/css/notes.css"/>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { initNotePreviewModal, viewNote, closeNoteModal, closeNoteModalAndReload, editFromModal, modalTogglePin } from '/js/note-preview.js';
        import { renderMarkdownPreviews } from '/js/markdown-preview.js';

        window.viewNote = viewNote;
        window.closeNoteModal = closeNoteModal;
        window.closeNoteModalAndReload = closeNoteModalAndReload;
        window.editFromModal = editFromModal;
        window.modalTogglePin = modalTogglePin;

        document.addEventListener('DOMContentLoaded', () => {
            initNotePreviewModal();
            renderMarkdownPreviews();
        });
    </script>
    <script src="/js/notes.js" type="module"></script>
</head>
<body>

<div class="con animate">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div class="flex-grow-1" style="min-width:0">
                <h2 class="fs-5 fs-md-4 fs-lg-2 mb-0 text-truncate"
                    sec:authorize="isAuthenticated()"
                    th:text="'👋🏻 Hallo, ' + ${displayname} + '!'">
                    Placeholder
                </h2>
            </div>

            <div class="flex-shrink-0" sec:authorize="isAuthenticated()">
                <div class="dropdown">
                    <button class="btn btn-outline-dark dropdown-toggle px-3"
                            data-bs-toggle="dropdown">
                        ⚙️ Menü
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>
                            <button class="dropdown-item" id="archiveButton">
                                🗃️ Archiv
                            </button>
                        </li>

                        <li>
                            <button class="dropdown-item" id="binButton">
                                🗑️ Papierkorb
                            </button>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <button type="submit" class="dropdown-item text-danger">
                                    Logout
                                </button>
                            </form>
                        </li>

                    </ul>
                </div>
            </div>
        </div>

        <div class="row g-2 align-items-end">

            <div class="col-12 col-lg-6 mb-2 mb-lg-0">
                <div class="input-group shadow-sm">
                    <input class="form-control border px-3 py-2"
                           type="text"
                           id="searchInput"
                           placeholder="Suche in Notizen..."
                           autocomplete="off"
                           th:value="${search}">
                    <button class="btn border"
                            type="button"
                            id="clearSearchBtn"
                            title="Suche zurücksetzen">
                        ✕
                    </button>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="row g-2">
                    <div class="col-6 col-lg-3">
                        <div class="dropdown">
                            <button class="btn btn-outline-primary w-100 shadow-sm dropdown-toggle text-truncate"
                                    data-bs-toggle="dropdown" id="tagFilterBtn">
                            <span id="selectedTagDisplay"
                                  th:text="${tagFilter != null and tagFilter != ''} ? '#' + ${tagFilter} : 'Tags'">
                                Tags
                            </span>
                            </button>
                            <ul class="dropdown-menu w-100">
                                <li><a class="dropdown-item fw-semibold tag-filter-item active-tag-filter" data-tag-value="" data-tag-name="Alle Tags" href="#">Alle Tags</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li th:each="tag : ${allTags}">
                                    <a class="dropdown-item tag-filter-item"
                                       th:classappend="${tagFilter != null and tagFilter == tag} ? 'active-tag-filter'"
                                       th:attr="data-tag-value=${tag},data-tag-name='#' + ${tag}"
                                       th:text="'#' + ${tag}" href="#"></a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary w-100 shadow-sm dropdown-toggle text-truncate"
                                    data-bs-toggle="dropdown" id="sortBtn">
                                <span id="selectedSortDisplay">Sort</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end w-100" id="sortMenu">
                                <li><a class="dropdown-item active" href="#" data-sort-field="created" data-sort-dir="desc">Erstellt ↓</a></li>
                                <li><a class="dropdown-item" href="#" data-sort-field="updated" data-sort-dir="desc">Geändert ↓</a></li>
                                <li><a class="dropdown-item" href="#" data-sort-field="title" data-sort-dir="asc">Titel ↑</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <button class="btn btn-outline-secondary w-100 shadow-sm"
                                type="button"
                                id="previewToggleBtn"
                                aria-pressed="false"
                                title="Mini-Vorschau der Notizen ausblenden">
                            <span aria-hidden="true">&#128065;&#65039;</span>
                            <span id="previewToggleLabel">Vorschau aus</span>
                        </button>
                    </div>
                    <div class="col-6 col-lg-3">
                        <button class="btn btn-primary w-100 shadow-sm" id="newNoteBtn" title="Neue Notiz">
                            ➕ Neue Notiz
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bulk-action-bar d-none mt-3" id="bulkActionBar">
            <div class="bulk-selection-count">
                <strong id="selectedNoteCount">0</strong> ausgew&auml;hlt
            </div>
            <div class="bulk-action-buttons">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="clearSelectionBtn">Aufheben</button>
                <button type="button" class="btn btn-warning text-dark btn-sm" data-bulk-action="archive">&#128451;&#65039; Archivieren</button>
                <button type="button" class="btn btn-danger btn-sm" data-bulk-action="delete">&#128465;&#65039; L&ouml;schen</button>
            </div>
        </div>

    <div class="center-gap m-3" id="notesEmptyState"
         th:style="${notes.content.isEmpty()} ? '' : 'display: none;'">
        <h5 class="fst-italic">Keine Notizen vorhanden</h5>
    </div>

    <div id="pinnedNotesSection"
         th:style="${pinnedNotes.isEmpty()} ? 'display: none;' : ''">
        <h5 class="ms-3 mt-3 mb-2 text-muted fw-semibold" style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">📌 Angeheftet</h5>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3 pinned-notes-section"
             id="pinnedNotesList">
            <div class="col" th:each="note : ${pinnedNotes}" th:id="'note-' + ${note.id}">
                <div class="card h-100 border-1 shadow-sm rounded-4 overflow-hidden click-card pinned-card"
                     th:onclick="'viewNote(' + ${note.id} + '); event.stopPropagation();'"
                     th:data-note-id="${note.id}">
                    <label class="note-select-toggle" title="Notiz ausw&auml;hlen" onclick="event.stopPropagation();">
                        <input type="checkbox" class="note-select-checkbox" th:value="${note.id}" aria-label="Notiz ausw&auml;hlen">
                        <span></span>
                    </label>
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                            <span class="pin-icon" title="Angeheftet">📌</span>
                            <h5 class="title m-0" th:text="${note.title}">Notiz</h5>
                        </div>
                        <div class="d-flex align-items-center gap-1 note-card-toolbar">
                            <button th:class="${note.pinned} ? 'btn btn-warning pin-btn' : 'btn btn-secondary pin-btn'"
                                    th:title="${note.pinned} ? 'Trennen' : 'Anheften'"
                                    th:onclick="'togglePin(' + ${note.id} + '); event.stopPropagation();'"
                                    th:data-note-id="${note.id}"
                                    th:attr="data-pinned=${note.pinned}">
                                <span th:text="${note.pinned} ? '📍' : '📌'">📌</span>
                            </button>
                            <button class="btn btn-primary" title="Bearbeiten"
                                    th:onclick="'window.location.href=\'/notes/' + ${note.id} + '\'; event.stopPropagation();'">
                                ✏️
                            </button>
                            <button class="btn btn-warning text-dark" title="Archivieren"
                                    th:onclick="'archiveNote(' + ${note.id} + '); event.stopPropagation();'">
                                🗃️
                            </button>
                            <button class="btn btn-danger" title="Löschen"
                                    th:onclick="'deleteNote(' + ${note.id} + '); event.stopPropagation();'">
                                🗑️
                            </button>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between gap-2 p-3">
                        <div class="d-flex gap-2">
                            <span class="text-primary-emphasis bg-primary-subtle rounded-3 p-1"
                                  th:if="${note.tags != null and #lists.size(note.tags) > 0}"
                                  th:each="tag : ${note.tags}"
                                  th:attr="data-tag=${tag}"
                                  th:text="'#' + ${tag}">
                            </span>
                        </div>

                        <div class="h-100 note-content-preview">
                            <div class="card-preview-markdown"
                                 th:if="${note.contentPreview != null and note.contentPreview.length() > 0}"
                                 th:attr="data-markdown=${note.contentPreview}"></div>
                            <span th:if="${note.contentPreview == null or note.contentPreview.length() == 0}" class="content text-muted">Keine Vorschau</span>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <div class="text-muted small d-flex flex-column">
                        <span class="local-time" th:if="${note.created != null}">
                            Erstellt: <span th:text="${#temporals.format(note.created, 'dd.MM.yyyy HH:mm')}"></span>
                        </span>
                            <span class="local-time" th:if="${note.updated != null}">
                            Zuletzt geändert: <span th:text="${#temporals.format(note.updated, 'dd.MM.yyyy HH:mm')}"></span>
                        </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pinned-divider"></div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3" id="notesList">
        <div class="col" th:each="note : ${unpinnedNotes}" th:id="'note-' + ${note.id}">
            <div class="card h-100 border-1 shadow-sm rounded-4 overflow-hidden click-card"
                 th:onclick="'viewNote(' + ${note.id} + '); event.stopPropagation();'"
                 th:data-note-id="${note.id}">
                <label class="note-select-toggle" title="Notiz ausw&auml;hlen" onclick="event.stopPropagation();">
                    <input type="checkbox" class="note-select-checkbox" th:value="${note.id}" aria-label="Notiz ausw&auml;hlen">
                    <span></span>
                </label>
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <h5 class="title m-0" th:text="${note.title}">Notiz</h5>
                    </div>
                    <div class="d-flex align-items-center gap-1 note-card-toolbar">
                        <button th:class="${note.pinned} ? 'btn btn-warning pin-btn' : 'btn btn-secondary pin-btn'"
                                th:title="${note.pinned} ? 'Trennen' : 'Anheften'"
                                th:onclick="'togglePin(' + ${note.id} + '); event.stopPropagation();'"
                                th:data-note-id="${note.id}"
                                th:attr="data-pinned=${note.pinned}">
                            <span th:text="${note.pinned} ? '📍' : '📌'">📌</span>
                        </button>
                        <button class="btn btn-primary" title="Bearbeiten"
                                th:onclick="'window.location.href=\'/notes/' + ${note.id} + '\'; event.stopPropagation();'">
                            ✏️
                        </button>
                        <button class="btn btn-warning text-dark" title="Archivieren"
                                th:onclick="'archiveNote(' + ${note.id} + '); event.stopPropagation();'">
                            🗃️
                        </button>
                        <button class="btn btn-danger" title="Löschen"
                                th:onclick="'deleteNote(' + ${note.id} + '); event.stopPropagation();'">
                            🗑️
                        </button>
                    </div>
                </div>
                <div class="card-body d-flex flex-column justify-content-between gap-2 p-3">
                    <div class="d-flex gap-2">
                        <span class="text-primary-emphasis bg-primary-subtle rounded-3 p-1"
                              th:if="${note.tags != null and #lists.size(note.tags) > 0}"
                              th:each="tag : ${note.tags}"
                              th:attr="data-tag=${tag}"
                              th:text="'#' + ${tag}">
                        </span>
                    </div>

                    <div class="h-100 note-content-preview">
                        <div class="card-preview-markdown"
                             th:if="${note.contentPreview != null and note.contentPreview.length() > 0}"
                             th:attr="data-markdown=${note.contentPreview}"></div>
                        <span th:if="${note.contentPreview == null or note.contentPreview.length() == 0}" class="content text-muted">Keine Vorschau</span>
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <div class="text-muted small d-flex flex-column">
                        <span class="local-time" th:if="${note.created != null}">
                            Erstellt: <span th:text="${#temporals.format(note.created, 'dd.MM.yyyy HH:mm')}"></span>
                        </span>
                        <span class="local-time" th:if="${note.updated != null}">
                            Zuletzt geändert: <span th:text="${#temporals.format(note.updated, 'dd.MM.yyyy HH:mm')}"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="center-gap justify-content-center mt-4" th:if="${totalPages > 1}">
        <a class="btn btn-outline-secondary"
           th:classappend="${currentPage == 0} ? 'disabled'"
           th:href="@{/notes(pageNo=${currentPage - 1}, pageSize=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, tagFilter=${tagFilter}, search=${search})}">
            ← Zurück
        </a>

        <a class="btn btn-outline-secondary"
           th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'"
           th:href="@{/notes(pageNo=${currentPage + 1}, pageSize=${pageSize}, sortField=${sortField}, sortDir=${sortDir}, tagFilter=${tagFilter}, search=${search})}">
            Weiter →
        </a>
    </div>

</div>

<div id="noteViewModal" class="note-view-modal" style="display: none;">
    <div class="note-view-modal-backdrop"></div>
    <div class="note-view-modal-dialog">
        <div class="note-view-modal-content">
            <div class="note-view-modal-header">
                <h3 id="modalTitle" class="m-0"></h3>
                <button type="button" class="note-view-close-btn" onclick="closeNoteModalAndReload()" title="Schließen">×</button>
            </div>
            <div class="note-view-modal-body">
                <div id="modalTags" class="note-modal-tags mb-3"></div>
                <div id="modalContent" class="note-modal-content"></div>
            </div>
            <div class="note-view-modal-footer">
                <div id="modalTimestamp" class="note-modal-timestamp text-muted small"></div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary btn-sm" id="modalPinBtn" onclick="modalTogglePin(); event.stopPropagation();" style="display:none;">📌 Pin</button>
                    <button type="button" class="btn btn-primary btn-sm" id="modalEditBtn" onclick="editFromModal()">✏️ Bearbeiten</button>
                    <button type="button" class="btn btn-warning text-dark btn-sm" id="modalArchiveBtn">&#128451;&#65039; Archivieren</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
