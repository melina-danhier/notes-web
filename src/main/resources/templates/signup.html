<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/theme.js"></script>
    <title>Registrieren</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
    <script src="/js/loginSignup.js"></script>
</head>
<body class="align-items-center">

<div class="con align-items-center animate">
    <h2 class="mt-1">Konto erstellen</h2>

    <form id="signupForm" th:action="@{/signup}" th:object="${signupDto}"
          method="post" class="d-flex flex-column gap-3 my-2">
        <div th:if="${#fields.hasErrors('*')}"
             class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            <ul th:if="${#fields.hasErrors('*')}" class="mb-0">
                <li th:each="validationError : ${#fields.errors('*')}" th:text="${validationError}"></li>
            </ul>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Schließen"></button>
        </div>

        <div class="d-flex align-items-center gap-2 border rounded px-2">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="name" th:field="*{name}" placeholder="Vollständiger Name" required
                   maxlength="100" class="form-control border-0 shadow-none">
        </div>
        <div class="d-flex align-items-center gap-2 border rounded px-2">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="regEmail" th:field="*{email}" placeholder="E-Mail-Adresse" required
                   maxlength="255" class="form-control border-0 shadow-none">
        </div>
        <div class="d-flex align-items-center gap-2 border rounded px-2">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="regPassword" name="password"
                   placeholder="Passwort (6 bis 72 Zeichen)" required minlength="6" maxlength="72"
                   class="form-control border-0 shadow-none">
            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword(this)"></i>
        </div>
        <div class="d-flex align-items-center gap-2 border rounded px-2">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Passwort bestätigen" required minlength="6" maxlength="72"
                   class="form-control border-0 shadow-none">
            <i class="fa-solid fa-eye" onclick="togglePassword(this)"></i>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Registrieren</button>
    </form>
    <p>Bereits ein Konto?
        <a th:href="@{/login}" class="link-primary">Hier einloggen</a>
    </p>
</div>

</body>
</html>
