spring:
  datasource:
    url: jdbc:h2:mem:notes-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  docker:
    compose:
      enabled: false

logging:
  level:
    com.melina.notes.exception.GlobalExceptionHandler: off
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: off
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
